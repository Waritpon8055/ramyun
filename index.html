<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ร้านรามยอน คิดเงินและสรุปยอด</title>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Mitr:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --sunk:#E8ECF4; --ink:#18213D; --muted:#5A6484; --line:#D9DFEB;
  --red:#DB1230; --on-red:#FFFFFF; --yellow:#FFD426; --on-yellow:#18213D;
  --ok:#0E7A56; --warn:#A85800; --warn-bg:#FFF3D6; --bad-bg:#FFE3E6;
  --shadow:0 1px 0 rgba(24,33,61,.06), 0 8px 24px -12px rgba(24,33,61,.25);
  --display:"Mitr","Anuphan","Noto Sans Thai","Sukhumvit Set","Thonburi",system-ui,sans-serif;
  --body:"Anuphan","Noto Sans Thai","Sukhumvit Set","Thonburi",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1426; --surface:#182039; --sunk:#222C4A; --ink:#EEF1FA; --muted:#9CA6C4; --line:#2C3759;
    --red:#FF4A5E; --on-red:#1A0206; --ok:#4FD1A1; --warn:#FFC766; --warn-bg:#3A2E12; --bad-bg:#42161D;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1426; --surface:#182039; --sunk:#222C4A; --ink:#EEF1FA; --muted:#9CA6C4; --line:#2C3759;
  --red:#FF4A5E; --on-red:#1A0206; --ok:#4FD1A1; --warn:#FFC766; --warn-bg:#3A2E12; --bad-bg:#42161D;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;line-height:1.25}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.top{display:flex;align-items:center;gap:12px;padding:14px 16px 10px;max-width:1240px;margin:0 auto}
.top h1{font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .day{font-size:13px;color:var(--muted);text-align:right;line-height:1.3}
.top .day b{display:block;font-family:var(--display);font-weight:500;font-size:17px;color:var(--ink)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 9px;font-size:12px;color:var(--muted);position:relative}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--red);font-weight:600}
.tabs .dot{position:absolute;top:6px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--yellow);border:2px solid var(--surface)}
main{max-width:1240px;margin:0 auto;padding:4px 16px 150px}
.note{background:var(--warn-bg);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px;margin:0 0 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
body.login .tabs,body.login .day{display:none}
.auth{max-width:380px;margin:8vh auto 0}
.auth h2{font-size:22px;margin-bottom:4px}
.auth p{color:var(--muted);font-size:14px;margin:0 0 16px}
.auth .err{color:var(--red);font-size:14px;min-height:21px;margin:-4px 0 10px}
.note.stop{background:var(--bad-bg);border:1.5px solid var(--red)}
.note.stop b{color:var(--red)}
.note button{font-weight:600;text-decoration:underline;text-underline-offset:3px}
.empty{color:var(--muted);text-align:center;padding:28px 12px;font-size:15px}

/* ---------- common bits ---------- */
.card{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-size:17px;margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.chip.y[aria-pressed="true"]{background:var(--yellow);color:var(--on-yellow);border-color:var(--yellow)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 18px;border-radius:14px;font-family:var(--display);font-weight:500;font-size:17px;text-align:center;background:var(--sunk);color:var(--ink);width:100%}
.btn.red{background:var(--red);color:var(--on-red)}
.btn.line{background:none;border:1.5px solid var(--line)}
.btn.sm{min-height:40px;font-size:15px;padding:6px 14px;width:auto}
.btn:disabled{opacity:.45}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.step{display:inline-flex;align-items:center;background:var(--sunk);border-radius:12px}
.step button{width:40px;height:40px;font-size:22px;line-height:1;text-align:center;font-family:var(--display)}
.step span{min-width:30px;text-align:center;font-family:var(--display);font-size:17px}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.low{background:var(--yellow);color:var(--on-yellow)}
.tag.out,.tag.bad{background:var(--bad-bg);color:var(--red)}
.tag.ok{background:var(--sunk);color:var(--muted)}

/* ---------- sell ---------- */
.sell{display:block}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{display:flex;flex-direction:column;background:var(--surface);border-radius:18px;padding:6px 6px 10px;box-shadow:var(--shadow);position:relative;transition:transform .08s}
.tile:active{transform:scale(.97)}
.tile .ph{display:block;position:relative;aspect-ratio:5/4;border-radius:13px;overflow:hidden;background:var(--sunk)}
.tile .ph img{width:100%;height:100%;object-fit:cover}
.tile .noimg{display:grid;place-items:center;width:100%;height:100%;font-family:var(--display);font-size:40px;color:var(--muted)}
.tile .nm{padding:8px 6px 0;font-size:14.5px;font-weight:500;line-height:1.3;min-height:2.6em}
.tile .pr{padding:2px 6px 0;font-family:var(--display);font-size:20px;display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.tile .cnt{position:absolute;top:6px;left:6px;min-width:30px;height:30px;padding:0 8px;border-radius:999px;background:var(--red);color:var(--on-red);font-family:var(--display);font-size:16px;display:grid;place-items:center;font-weight:500}
.tile .st{position:absolute;right:6px;bottom:6px}
.tile:disabled .ph img{filter:grayscale(1);opacity:.5}
.tile:disabled .pr,.tile:disabled .nm{color:var(--muted)}
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;gap:12px;background:var(--red);color:var(--on-red);border-radius:18px;padding:12px 18px;font-family:var(--display);font-size:18px;box-shadow:0 10px 24px -8px rgba(219,18,48,.55)}
.cartbar .n{background:var(--yellow);color:var(--on-yellow);border-radius:999px;min-width:32px;height:32px;display:grid;place-items:center;padding:0 9px}
.cartbar .t{margin-left:auto;font-size:22px}
.aside{display:none}
.cart .ln{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.cart .ln .tx{flex:1;min-width:0}
.cart .gh{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted);padding:12px 0 2px;border-bottom:1px solid var(--line)}
.cart .gh:first-child{padding-top:0}
.cart .ln .th{width:44px;height:36px;flex:none;border-radius:9px;overflow:hidden;background:var(--sunk)}
.cart .ln .th img{width:100%;height:100%;object-fit:cover}
.cart .ln .th .noimg{display:grid;place-items:center;width:100%;height:100%;font-family:var(--display);color:var(--muted)}
.cart .ln .tx b{display:block;font-weight:600;font-size:15px}
.cart .ln .tx small{display:block;color:var(--muted);font-size:13px}
.cart .ln .am{font-family:var(--display);font-size:17px;min-width:56px;text-align:right}
.cart .tot{display:flex;justify-content:space-between;padding:4px 0;font-size:15px;color:var(--muted)}
.cart .tot.big{color:var(--ink);font-family:var(--display);font-size:28px;align-items:baseline;padding-top:8px}
.cart .tot.big span:first-child{font-size:17px}
.cart h3{font-size:14px;font-family:var(--body);font-weight:600;color:var(--muted);margin:14px 0 6px}
.cart .chips{flex-wrap:wrap;overflow:visible;padding-bottom:4px}
.cart .acts{margin-top:14px;display:grid;gap:10px}
.linkbtn{color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:6px;justify-self:center}

/* ---------- summary ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi span{display:block;font-size:13px;color:var(--muted)}
.kpi b{font-family:var(--display);font-weight:500;font-size:26px;line-height:1.2}
.kpi.main{grid-column:1/-1;background:var(--ink);color:var(--bg)}
.kpi.main span{color:inherit;opacity:.7}
.kpi.main b{font-size:40px}
.kpi.main i{font-style:normal;display:inline-block;margin-left:10px;background:var(--yellow);color:var(--on-yellow);border-radius:999px;padding:2px 10px;font-size:14px;font-family:var(--body);font-weight:600;vertical-align:middle}
.read{font-size:14px;color:var(--muted);margin:-4px 0 10px;min-height:21px}
.read b{color:var(--ink);font-family:var(--display);font-weight:500;font-size:16px}
.bars{display:flex;align-items:flex-end;gap:3px;height:170px;border-bottom:1.5px solid var(--line)}
.bars button{flex:1;height:100%;display:flex;align-items:flex-end;min-width:0;border-radius:6px 6px 0 0}
.bars i{display:block;width:100%;background:var(--red);opacity:.38;border-radius:6px 6px 0 0;min-height:2px}
.bars button[aria-pressed="true"] i{opacity:1}
.bars button.zero i{background:var(--line);opacity:1}
.xl{display:flex;gap:3px;margin-top:4px}
.xl span{flex:1;min-width:0;text-align:center;font-size:11px;color:var(--muted);white-space:nowrap;overflow:visible}
.rank{display:grid;gap:12px}
.rk{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center}
.rk img,.rk .noimg{width:44px;height:36px;border-radius:8px;object-fit:cover;background:var(--sunk)}
.rk .nm{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .bar{height:8px;border-radius:99px;background:var(--sunk);margin-top:4px;overflow:hidden}
.rk .bar i{display:block;height:100%;border-radius:99px;background:var(--red)}
.rk:first-child .bar i{background:var(--yellow);box-shadow:inset 0 0 0 1.5px var(--ink)}
.rk .v{font-family:var(--display);font-size:16px;text-align:right;line-height:1.2}
.rk .v small{display:block;font-family:var(--body);font-size:12px;color:var(--muted)}
.split{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--sunk);margin:6px 0 8px}
.split i{background:var(--ink)} .split i+i{background:var(--yellow)} .split i+i+i{background:var(--red)}
.legend{display:flex;justify-content:space-between;font-size:14px}
.bill{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.bill:last-child{border-bottom:0}
.bill .tx{flex:1;min-width:0;font-size:14px}
.bill .tx b{font-weight:600}
.bill .tx small{display:block;color:var(--muted)}
.bill .am{font-family:var(--display);font-size:16px;text-align:right}
.bill.void .tx,.bill.void .am{text-decoration:line-through;color:var(--muted)}
.twocol{display:block}

/* ---------- stock / settings ---------- */
.alert{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:14.5px;border-bottom:1px dashed var(--line)}
.alert:last-child{border-bottom:0}
.alert span:first-child{flex:1}
.sk{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)}
.sk:last-child{border-bottom:0}
.sk img,.sk .noimg{width:56px;height:46px;border-radius:10px;object-fit:cover;background:var(--sunk)}
.sk .noimg,.rk .noimg{display:grid;place-items:center;font-family:var(--display);color:var(--muted)}
.sk .nm{font-weight:600;font-size:15px;line-height:1.3}
.sk .mt{font-size:13px;color:var(--muted)}
.sk .mt b{color:var(--ok);font-weight:600}
.sk .rt{display:grid;gap:6px;justify-items:end}
.setrow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .tx{flex:1;min-width:0}
.setrow .tx b{display:block;font-weight:600}
.setrow .tx small{color:var(--muted);font-size:13.5px;display:block}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,14,30,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet .hd{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sheet .hd h2{flex:1;font-size:20px}
.sheet .x{width:40px;height:40px;border-radius:50%;background:var(--sunk);font-size:20px;text-align:center}
.opt-img{width:100%;aspect-ratio:5/2;object-fit:cover;border-radius:14px;margin-bottom:12px}
.tops{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tops button{display:flex;justify-content:space-between;gap:6px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);font-size:15px}
.tops button[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow);color:var(--on-yellow);font-weight:600}
.qtyrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
label.f{display:block;font-size:14px;color:var(--muted);margin-bottom:12px}
label.f input,label.f select,.in{display:block;width:100%;margin-top:4px;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:16px;color:var(--ink)}
.paybox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.paydue,.payin{background:var(--sunk);border-radius:14px;padding:10px 14px;min-width:0}
.paydue span,.payin span{display:block;font-size:13px;color:var(--muted)}
.paydue b{font-family:var(--display);font-weight:500;font-size:30px;line-height:1.2}
.payin{background:var(--surface);border:2px solid var(--yellow)}
.payin input{display:block;width:100%;border:0;background:none;padding:0;font-family:var(--display);font-size:30px;line-height:1.2;color:var(--ink);outline:none;caret-color:transparent}
.paygrid{display:grid;gap:10px;margin-bottom:12px}
.notes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.note-b{min-height:48px;border-radius:10px;font-family:var(--display);font-size:17px;font-weight:500;text-align:center;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.note-b.n1000{background:#7A5C3E}.note-b.n500{background:#6B3FA0}.note-b.n100{background:#C0283A}.note-b.n50{background:#2E62B5}.note-b.n20{background:#2E8B57}
.note-b.c{background:var(--sunk);color:var(--ink);border-radius:999px;box-shadow:inset 0 0 0 2px var(--line)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{min-height:52px;border-radius:12px;background:var(--sunk);font-family:var(--display);font-size:24px;text-align:center}
.pad button:active,.note-b:active{transform:scale(.96)}
.change.big b{font-size:36px}
@media (min-width:600px){ .paygrid{grid-template-columns:1fr 1fr} .notes{grid-template-columns:repeat(2,1fr);align-content:start} }
.cashin{font-family:var(--display);font-size:34px!important;text-align:right}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.change{display:flex;justify-content:space-between;align-items:baseline;background:var(--sunk);border-radius:14px;padding:12px 16px;margin-bottom:14px;font-size:15px}
.change b{font-family:var(--display);font-weight:500;font-size:28px}
.qr{background:#fff;border-radius:16px;padding:14px;width:min(260px,70%);margin:6px auto 10px}
.qr svg{display:block;width:100%;height:auto}
.center{text-align:center}
.erow{display:grid;grid-template-columns:1.6fr 1fr 1fr 36px;gap:6px;margin-bottom:8px;align-items:center}
.erow .in{margin:0;padding:10px 8px;font-size:15px;min-width:0}
.erow button{font-size:20px;color:var(--muted);text-align:center}
.ehead{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:15px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

.mfind .in{margin-top:0}
.sq{margin:0 0 10px!important;font-size:16px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--sunk);padding:5px;border-radius:16px;margin-bottom:12px}
.seg button{min-height:48px;border-radius:12px;font-family:var(--display);font-size:17px;padding:0 4px;text-align:center;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg b{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 7px;border-radius:999px;background:var(--red);color:var(--on-red);font-size:14px;font-weight:500;margin-left:6px;vertical-align:middle}
.due{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.due:last-child{border-bottom:0}
.due .tx{flex:1;min-width:0}
.due .tx b{display:block;font-weight:600}
.due .tx small{color:var(--muted);font-size:13px}
.cmp{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:15px;margin:4px 0 12px}
.cmp span:nth-child(even){font-family:var(--display);text-align:right;font-variant-numeric:tabular-nums}
.cmp .tot{font-weight:600;border-top:1px solid var(--line);padding-top:6px}
.neg{color:var(--red)}
.mrow2{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:8px 0}
.mrow2 .bar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.mrow2 .bar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.mrow2 .bar i.neg{background:var(--red)}
.mrow2 .v{font-family:var(--display);text-align:right;line-height:1.2}
.mrow2 .v small{display:block;font-family:var(--body);font-size:12px;color:var(--muted)}
.chk{display:flex;gap:10px;align-items:center;font-size:14.5px;margin:0 0 14px}
.chk input{width:20px;height:20px}
.pimg{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.pprev{width:120px;flex:none;aspect-ratio:5/4;max-width:40%;border-radius:12px;overflow:hidden;background:var(--sunk);display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:4px}
.pprev img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.pacts{display:grid;gap:4px;justify-items:start;min-width:0}

<script>
const IMG = {"samyang": "assets/products/samyang.jpg", "cha-spicy": "assets/products/cha-spicy.jpg", "kimchi": "assets/products/kimchi.jpg", "cha": "assets/products/cha.jpg", "shin": "assets/products/shin.jpg", "bd-original": "assets/products/bd-original.jpg", "bd-3x": "assets/products/bd-3x.jpg", "bd-carbo": "assets/products/bd-carbo.jpg", "bd-cheese": "assets/products/bd-cheese.jpg", "bd-cream": "assets/products/bd-cream.jpg"};
const DEFAULT_CFG = {"shopName": "ร้านรามยอน", "promptpay": "", "expDays": 30, "products": [{"id": "bd-carbo", "img": "bd-carbo", "name": "บุลดัก คาโบนาร่า", "cat": "บุลดักผัดเผ็ด", "price": 85, "cost": 46, "stock": 24, "low": 6, "exp": "2027-05-31", "active": true}, {"id": "bd-cheese", "img": "bd-cheese", "name": "บุลดัก ชีส", "cat": "บุลดักผัดเผ็ด", "price": 85, "cost": 46, "stock": 18, "low": 6, "exp": "2027-07-07", "active": true}, {"id": "bd-original", "img": "bd-original", "name": "บุลดัก ออริจินัล", "cat": "บุลดักผัดเผ็ด", "price": 79, "cost": 42, "stock": 20, "low": 6, "exp": "", "active": true}, {"id": "bd-cream", "img": "bd-cream", "name": "บุลดัก ครีมคาโบนาร่า", "cat": "บุลดักผัดเผ็ด", "price": 89, "cost": 48, "stock": 4, "low": 6, "exp": "2027-07-01", "active": true}, {"id": "bd-3x", "img": "bd-3x", "name": "บุลดัก เผ็ด x3", "cat": "บุลดักผัดเผ็ด", "price": 85, "cost": 45, "stock": 12, "low": 5, "exp": "2027-07-06", "active": true}, {"id": "cha", "img": "cha", "name": "จาจาโรนี จาจังมยอน", "cat": "จาจังมยอน", "price": 75, "cost": 38, "stock": 15, "low": 5, "exp": "2027-06-11", "active": true}, {"id": "cha-spicy", "img": "cha-spicy", "name": "จาจาโรนี จาจังเผ็ด", "cat": "จาจังมยอน", "price": 79, "cost": 40, "stock": 9, "low": 5, "exp": "", "active": true}, {"id": "shin", "img": "shin", "name": "ชิน รามยอน", "cat": "รามยอนน้ำ", "price": 65, "cost": 30, "stock": 16, "low": 5, "exp": "", "active": true}, {"id": "kimchi", "img": "kimchi", "name": "กิมจิ ราเมง", "cat": "รามยอนน้ำ", "price": 59, "cost": 26, "stock": 3, "low": 5, "exp": "2027-03-12", "active": true}, {"id": "samyang", "img": "samyang", "name": "ซัมยัง ราเมง ออริจินัล", "cat": "รามยอนน้ำ", "price": 59, "cost": 25, "stock": 14, "low": 5, "exp": "2027-05-06", "active": true}], "toppings": [{"id": "t-egg", "name": "ไข่ต้ม", "price": 10, "cost": 5}, {"id": "t-cheese", "name": "ชีสสไลซ์", "price": 15, "cost": 8}, {"id": "t-sausage", "name": "ไส้กรอก", "price": 15, "cost": 8}, {"id": "t-crab", "name": "ปูอัด", "price": 15, "cost": 7}, {"id": "t-kimchi", "name": "กิมจิ", "price": 20, "cost": 10}, {"id": "t-tteok", "name": "ต๊อกบกกี", "price": 20, "cost": 9}], "promos": [{"id": "d-10", "name": "", "type": "pct", "val": 10}, {"id": "d-20", "name": "", "type": "baht", "val": 20}, {"id": "d-std", "name": "นักเรียน ลด 5%", "type": "pct", "val": 5}]};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const B = n => '฿' + Math.round(n || 0).toLocaleString('en-US');
const N = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const pad = n => String(n).padStart(2, '0');
const dkey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => dkey(new Date());
const parts = k => k.split('-').map(Number);
const addDays = (k, n) => { const [y, m, d] = parts(k); return dkey(new Date(y, m - 1, d + n)); };
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_D = ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
const fmtDay = k => { const [y, m, d] = parts(k); return TH_D[new Date(y, m - 1, d).getDay()] + ' ' + d + ' ' + TH_M[m - 1]; };
const clone = o => JSON.parse(JSON.stringify(o));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);

/* ---------- state ---------- */
const S = {
  ready: false, mode: 'loading', cfg: null, days: {},
  tab: 'sell', cat: 'ทั้งหมด', cart: [], disc: { type: 'none' },
  range: 'today', sel: null, rankBy: 'qty', sheet: null, mem: [], cm: null, redeem: false, mq: '', imgs: {}, ro: false, offline: false, exp: {}, expM: 'cur', stockTab: 'noodle', sellTab: 'noodle',
  base: { cfg: null, top: {}, prod: {}, mem: {}, sale: {}, exp: {}, close: {} }
};
let db = null, dl = null, toastTimer = null;

function defaultBuyItems(oldCats) {
  const amtOf = id => ((oldCats || []).find(x => x.id === id) || {}).amt || 0;
  return [['c-rent', 'ค่าเช่า', true], ['c-elec', 'ค่าไฟ', true], ['c-water', 'ค่าน้ำ', true], ['c-gas', 'แก๊ส', false],
    ['b-egg', 'ไข่ไก่', false], ['b-cheese', 'ชีสสไลซ์', false], ['b-sausage', 'ไส้กรอก', false], ['b-crab', 'ปูอัด', false],
    ['b-kimchi', 'กิมจิ', false], ['b-tteok', 'ต๊อกบกกี', false], ['b-cup', 'ถ้วยและตะเกียบ', false], ['b-bag', 'ถุงหิ้ว', false]]
    .map(([id, name, fixed]) => ({ id, name, fixed, price: amtOf(id), uses: 0 }));
}
function prodCatsOf(c) {
  const list = Array.isArray(c.prodCats) ? c.prodCats.slice() : [];
  (c.products || []).forEach(p => { if (p.cat && !list.includes(p.cat)) list.push(p.cat); });
  return list;
}
function normCfg(c) {
  c = c || {};
  return {
    shopName: c.shopName || 'ร้านรามยอน', promptpay: c.promptpay || '', expDays: c.expDays || 30,
    products: Array.isArray(c.products) ? c.products : [],
    toppings: Array.isArray(c.toppings) ? c.toppings : [],
    promos: Array.isArray(c.promos) ? c.promos : [],
    loyalty: { per: +(c.loyalty || {}).per || 60, need: +(c.loyalty || {}).need || 10, bday: +(c.loyalty || {}).bday || 2 },
    prodCats: prodCatsOf(c),
    buyItems: Array.isArray(c.buyItems) ? c.buyItems : defaultBuyItems(c.expCats),
    float: +c.float || 0
  };
}
const prod = id => S.cfg.products.find(p => p.id === id);
const topOf = id => S.cfg.toppings.find(t => t.id === id);
const counted = x => !!x && typeof x.stock === 'number';           // a topping with no stock number is not counted yet
const GROUP = { top: { label: 'ท็อปปิ้ง', unit: 'ที่', tab: 'tops' }, drink: { label: 'เครื่องดื่ม', unit: 'ขวด', tab: 'drinks' } };
const grpOf = x => x && x.g === 'drink' ? 'drink' : 'top';
const tabGrp = tab => tab === 'drinks' ? 'drink' : 'top';
const extras = g => S.cfg.toppings.filter(t => grpOf(t) === g);
const topUnit = t => t.unit || GROUP[grpOf(t)].unit;
const topInCart = id => S.cart.reduce((a, l) => a + (l.tp === id ? l.q : 0) + (l.tops.some(t => t.id === id) ? l.q : 0), 0);
const topLeft = id => { const t = topOf(id); return counted(t) ? t.stock - topInCart(id) : Infinity; };
function moveTops(lines, sign) { lines.forEach(l => [...(l.tp ? [{ id: l.tp }] : []), ...(l.tops || [])].forEach(t => { const tp = topOf(t.id); if (counted(tp)) tp.stock = Math.max(0, tp.stock + sign * l.q); })); }
const isBowl = l => !l.tp;
const imgOf = p => (p && S.imgs[p.id]) || (p && p.img && IMG[p.img]) || '';
const thumb = (p, name) => imgOf(p) ? `<img src="${imgOf(p)}" alt="">` : `<span class="noimg">${esc((name || '?').trim().charAt(0))}</span>`;

/* ---------- persistence ---------- */
/* Each record (product, member, bill, expense, day close) is its own row.
   Saves send only what changed: changed fields are merged, counters (stock, points)
   are sent as +/- amounts, so sales from several devices add up instead of overwriting. */
const W = {};
const J = JSON.stringify;
function queueOp(path, getOp) {
  if (!db) return;
  const w = W[path] || (W[path] = { busy: false, dirty: false });
  w.getOp = getOp;
  if (w.busy) { w.dirty = true; return; }
  w.busy = true;
  (async () => {
    do {
      w.dirty = false;
      const op = w.getOp();
      if (!op) continue;
      try {
        const ref = db.doc(path);
        const res = op.type === 'delete' ? await ref.delete() : op.type === 'apply' ? await ref.apply(op.patch, op.incr) : await ref.set(clone(op.data));
        if (op.done) op.done(res);
      } catch (e) {
        writeFailed(e);
        if (e && e.code === 'unavailable') { S.offline = true; render(); await new Promise(r => setTimeout(r, 4000)); w.dirty = true; }
      }
    } while (w.dirty);
    w.busy = false;
    if (S.offline && !Object.values(W).some(x => x.busy)) { S.offline = false; render(); toast('บันทึกข้อมูลที่ค้างไว้เรียบร้อยแล้ว'); }
  })();
}
function queueWrite(path, getData) { queueOp(path, () => { const d = getData(); return d === null ? { type: 'delete' } : { type: 'set', data: d }; }); }
const INCR = { top: ['stock'], prod: ['stock'], mem: ['pts', 'spent', 'visits'], sale: [], exp: [], close: [] };
function diffOp(local, base, keys) {
  const patch = {}, incr = {}; let n = 0;
  new Set([...Object.keys(local), ...Object.keys(base)]).forEach(k => {
    if (keys.includes(k)) { const d = (+local[k] || 0) - (+base[k] || 0); if (d) { incr[k] = d; n++; } }
    else if (J(local[k]) !== J(base[k])) { patch[k] = local[k] === undefined ? null : local[k]; n++; }
  });
  return n ? { patch, incr } : null;
}
function merge3(local, base, remote, keys) {
  new Set([...Object.keys(remote), ...Object.keys(base)]).forEach(k => {
    if (keys.includes(k)) local[k] = Math.max(0, (+local[k] || 0) + (+remote[k] || 0) - (+base[k] || 0));
    else if (J(local[k]) === J(base[k])) { if (remote[k] === undefined || remote[k] === null && base[k] === undefined) delete local[k]; else local[k] = clone(remote[k]); }
  });
  return local;
}
const findLocal = {
  top: id => S.cfg.toppings.find(t => t.id === id),
  prod: id => S.cfg.products.find(p => p.id === id),
  mem: id => S.mem.find(m => m.id === id),
  sale: id => { for (const k in S.days) { const b = (S.days[k].bills || []).find(x => x.id === id); if (b) return b; } return null; },
  exp: id => { for (const k in S.exp) { const i = (S.exp[k].items || []).find(x => x.id === id); if (i) return i; } return null; },
  close: date => (S.days[date] || {}).close || null
};
const PREFIX = { top: 'topping/', prod: 'product/', mem: 'member/', sale: 'sale/', exp: 'exp/', close: 'close/' };
function keyFor(kind, id, local) {
  const b = S.base[kind][id];
  if (b && b._key) return b._key;
  return (kind === 'sale' || kind === 'exp') ? (local ? local.date : '0000-00-00') + '_' + id : id;
}
function syncRecord(kind, id) {
  const path = PREFIX[kind] + keyFor(kind, id, findLocal[kind](id)), keys = INCR[kind];
  queueOp(path, () => {
    const local = findLocal[kind](id), base = S.base[kind][id];
    if (!local && !base) return null;
    if (!local) return { type: 'delete', done: () => { delete S.base[kind][id]; } };
    const key = path.slice(PREFIX[kind].length);
    const strip = o => { const c = clone(o); delete c._key; return c; };
    if (!base || !keys.length) {
      if (base && J(strip(local)) === J(strip(base))) return null;
      const data = strip(local);
      return { type: 'set', data, done: () => { S.base[kind][id] = { ...clone(data), _key: key }; } };
    }
    const d = diffOp(strip(local), strip(base), keys);
    if (!d) return null;
    const expected = strip(base); Object.assign(expected, d.patch);
    Object.keys(d.incr).forEach(k => expected[k] = Math.max(0, (+expected[k] || 0) + d.incr[k]));
    return { type: 'apply', patch: d.patch, incr: d.incr, done: srv => {
      const now = findLocal[kind](id);
      if (srv && now) merge3(now, expected, srv, keys);
      S.base[kind][id] = { ...clone(srv || expected), _key: key };
    } };
  });
}
function onRemote(kind, key, data, removed, addLocal, removeLocal) {
  const id = kind === 'close' ? key : (data && data.id) || (Object.keys(S.base[kind]).find(i => S.base[kind][i]._key === key));
  if (!id) return;
  const w = W[PREFIX[kind] + key];
  if (w && w.busy) return;
  const base = S.base[kind][id], local = findLocal[kind](id), keys = INCR[kind];
  if (removed) { if (!local || !base || J(local) === J({ ...base, _key: undefined })) { if (local) removeLocal(id); delete S.base[kind][id]; } return; }
  if (!local) addLocal(clone(data)); else merge3(local, base ? (({ _key, ...b }) => b)(base) : {}, data, keys);
  S.base[kind][id] = { ...clone(data), _key: key };
}
function writeFailed(e) {
  const code = e && e.code;
  if (code === 'denied' && !S.ro) { S.ro = true; render(); }
  if (code === 'unavailable' && S.offline) return;
  toast(code === 'quota_exceeded' ? 'ที่เก็บข้อมูลเต็ม ลบบิลเก่าหรือส่งออกแล้วล้างข้อมูลก่อน'
      : code === 'denied' ? 'บัญชีนี้ไม่มีสิทธิ์บันทึก ข้อมูลล่าสุดยังไม่ถูกเก็บ'
      : 'ยังบันทึกไม่ได้ ระบบจะลองใหม่ให้เองเมื่อเน็ตกลับมา');
}
let cfgTimer = null;
const cfgData = c => { const o = { ...c }; delete o.products; delete o.toppings; return clone(o); };
function saveCfg() {
  clearTimeout(cfgTimer);
  cfgTimer = setTimeout(() => {
    cfgTimer = null;
    queueOp('config/shop', () => { const d = cfgData(S.cfg); if (S.base.cfg && J(d) === J(S.base.cfg)) return null; return { type: 'set', data: d, done: () => { S.base.cfg = d; } }; });
    new Set([...S.cfg.products.map(p => p.id), ...Object.keys(S.base.prod)]).forEach(id => syncRecord('prod', id));
    new Set([...S.cfg.toppings.map(t => t.id), ...Object.keys(S.base.top)]).forEach(id => syncRecord('top', id));
  }, 350);
}
function saveImg(id) { queueWrite('images/' + id, () => S.imgs[id] ? { data: S.imgs[id] } : null); }
function saveMem() { new Set([...S.mem.map(m => m.id), ...Object.keys(S.base.mem)]).forEach(id => syncRecord('mem', id)); }
function saveDay(k) {
  const d = S.days[k] || { bills: [] };
  new Set([...d.bills.map(b => b.id), ...Object.keys(S.base.sale).filter(id => (S.base.sale[id]._key || '').startsWith(k + '_'))]).forEach(id => syncRecord('sale', id));
  if (d.close || S.base.close[k]) syncRecord('close', k);
}
function saveExp(mk) { new Set([...expItems(mk).map(i => i.id), ...Object.keys(S.base.exp).filter(id => (S.base.exp[id].date || '').startsWith(mk))]).forEach(id => syncRecord('exp', id)); }

/* ---------- Supabase storage ----------
   Every record is one row in table "docs": path ("config/shop", "days/2026-10-19",
   "members/all", "images/<productId>") + data (jsonb). This adapter gives the app the
   same doc/collection API it was written against. */
let sb = null;
const sbErr = e => ({ code: e && (e.code === '42501' || /row-level security|JWT|permission/i.test(e.message || '')) ? 'denied' : 'unavailable', message: (e && e.message) || '' });
function makeDb(client) {
  const listeners = new Set();
  client.channel('docs-changes').on('postgres_changes', { event: '*', schema: 'public', table: 'docs' }, p => {
    const path = (p.new && p.new.path) || (p.old && p.old.path);
    if (!path) return;
    const removed = p.eventType === 'DELETE';
    listeners.forEach(fn => fn(path, removed ? undefined : p.new.data, removed));
  }).subscribe();
  const snapOf = (path, data) => ({ id: path.split('/').pop(), exists: data !== undefined, data: () => data, metadata: { fromCache: false, hasPendingWrites: false } });
  const doc = path => ({
    id: path.split('/').pop(), path,
    async get() { const { data, error } = await client.from('docs').select('data').eq('path', path).maybeSingle(); if (error) throw sbErr(error); return snapOf(path, data ? data.data : undefined); },
    async set(body) { const { error } = await client.from('docs').upsert({ path, data: body, updated_at: new Date().toISOString() }); if (error) throw sbErr(error); return body; },
    // merge fields and add to counters in one database step, so two devices never overwrite each other
    async apply(patch, incr) { const { data, error } = await client.rpc('docs_apply', { p_path: path, p_patch: patch, p_incr: incr }); if (error) throw sbErr(error); return data; },
    async delete() { const { error } = await client.from('docs').delete().eq('path', path); if (error) throw sbErr(error); },
    onSnapshot(next, fail) {
      let live = true;
      const fn = (p, data, removed) => { if (live && p === path) next(snapOf(path, removed ? undefined : data)); };
      listeners.add(fn);
      this.get().then(sn => live && next(sn), e => fail && fail(e));
      return () => { live = false; listeners.delete(fn); };
    }
  });
  const query = (coll, from) => ({
    // only the app's one filter is needed: days on or after a date (the day's id is its date)
    where(field, op, value) { return query(coll, coll + '/' + value); },
    limit() { return this; },
    async get() {
      let q = client.from('docs').select('path,data').like('path', coll + '/%');
      if (from) q = q.gte('path', from);
      const { data, error } = await q.limit(5000); if (error) throw sbErr(error);
      const docs = data.map(r => snapOf(r.path, r.data));
      return { docs, size: docs.length, empty: !docs.length, docChanges: () => docs.map(d => ({ type: 'added', doc: d })) };
    },
    onSnapshot(next, fail) {
      let live = true; const cur = new Map();
      const out = changes => ({ docs: [...cur.values()], size: cur.size, empty: !cur.size, docChanges: () => changes });
      const fn = (p, data, removed) => {
        if (!live || !p.startsWith(coll + '/') || p.split('/').length !== coll.split('/').length + 1 || (from && p < from)) return;
        const id = p.split('/').pop(), old = cur.get(id);
        if (removed) { if (!old) return; cur.delete(id); next(out([{ type: 'removed', doc: old }])); return; }
        const d = snapOf(p, data); cur.set(id, d); next(out([{ type: old ? 'modified' : 'added', doc: d }]));
      };
      listeners.add(fn);
      this.get().then(sn => { if (!live) return; sn.docs.forEach(d => cur.set(d.id, d)); next(out(sn.docs.map(d => ({ type: 'added', doc: d })))); }, e => fail && fail(e));
      return () => { live = false; listeners.delete(fn); };
    }
  });
  return { doc, collection: c => ({ ...query(c, null), path: c, doc: id => doc(c + '/' + id) }) };
}

  S.mode = 'db';
  const fail = () => { if (!S.ready) { S.cfg = normCfg(clone(DEFAULT_CFG)); S.mode = 'memory'; S.ready = true; db = null; render(); } };
  const loaded = { cfg: false, prod: false };
  const ready = () => {
    if (S.ready || !loaded.cfg || !loaded.prod) return;
    S.cfg.products.sort((a, b) => (a.ord || 0) - (b.ord || 0));
    S.cfg.products.forEach(p => { if (p.cat && !S.cfg.prodCats.includes(p.cat)) S.cfg.prodCats.push(p.cat); });
    S.ready = true; render();
  };
  S.cfg = normCfg({}); S.cfg.products = []; S.cfg.toppings = [];
  db.doc('config/shop').onSnapshot(snap => {
    const w = W['config/shop'];
    if (S.ready && ((w && w.busy) || cfgTimer)) return;
    const fresh = normCfg(snap.exists ? clone(snap.data()) : clone(DEFAULT_CFG));
    fresh.products = S.cfg.products; fresh.toppings = S.cfg.toppings;
    S.cfg = fresh; S.base.cfg = cfgData(fresh);
    loaded.cfg = true; ready(); if (S.ready) render();
  }, fail);
  const listen = (coll, kind, addLocal, removeLocal, from) => {
    const q = from ? db.collection(coll).where('date', '>=', from) : db.collection(coll);
    q.onSnapshot(snap => {
      snap.docChanges().forEach(ch => onRemote(kind, ch.doc.id, ch.type === 'removed' ? null : ch.doc.data(), ch.type === 'removed', addLocal, removeLocal));
      if (kind === 'prod') { loaded.prod = true; ready(); }

  const [y, m] = parts(today());

  listen('topping', 'top', t => { S.cfg.toppings.push(t); S.cfg.toppings.sort((a, b) => (a.ord || 0) - (b.ord || 0)); }, id => { S.cfg.toppings = S.cfg.toppings.filter(t => t.id !== id); });
  listen('member', 'mem', mm => S.mem.push(mm), id => { S.mem = S.mem.filter(x => x.id !== id); });
  listen('sale', 'sale', b => { const d = dayOf(b.date); d.bills.push(b); d.bills.sort((a, c) => a.t < c.t ? -1 : 1); },
    id => { for (const k in S.days) S.days[k].bills = S.days[k].bills.filter(b => b.id !== id); }, cutoff);
  listen('close', 'close', c => { dayOf(c.date).close = c; }, k => { if (S.days[k]) delete S.days[k].close; }, cutoff);
  listen('exp', 'exp', i => { const mk = monthOf(i.date), e = S.exp[mk] || (S.exp[mk] = { month: mk, items: [] }); e.items.push(i); },
    id => { for (const k in S.exp) S.exp[k].items = S.exp[k].items.filter(i => i.id !== id); }, cutoff);
  db.collection('images').onSnapshot(snap => {
    snap.docChanges().forEach(ch => {

/* ---------- render: summary ---------- */
function rangeDays(r) {
  const t = today(), [y, m, d] = parts(t);
  if (r === 'today') return [t];
  if (r === '7d') return Array.from({ length: 7 }, (_, i) => addDays(t, i - 6));
  if (r === 'month') return Array.from({ length: d }, (_, i) => dkey(new Date(y, m - 1, i + 1)));
  const n = new Date(y, m - 1, 0).getDate();
  return Array.from({ length: n }, (_, i) => dkey(new Date(y, m - 2, i + 1)));
}
function viewSum() {
  const days = rangeDays(S.range);
  const bills = days.flatMap(k => liveBills(k).map(b => ({ ...b, day: k })));
  const all = days.flatMap(k => ((S.days[k] || {}).bills || []).map(b => ({ ...b, day: k })));
  const rev = bills.reduce((a, b) => a + b.total, 0), cost = bills.reduce((a, b) => a + (b.cost || 0), 0);
  const profit = rev - cost, disc = bills.reduce((a, b) => a + (b.disc || 0) + (b.free || 0), 0);
  const bowls = bills.reduce((a, b) => a + b.items.filter(isBowl).reduce((x, l) => x + l.q, 0), 0);
  const hasDemo = Object.values(S.days).some(d => (d.bills || []).some(b => b.demo));
  const ranges = [['today', 'วันนี้'], ['7d', '7 วัน'], ['month', 'เดือนนี้'], ['prev', 'เดือนก่อน']];

  // chart buckets
  let buckets;
  if (S.range === 'today') {
    const hrs = bills.map(b => new Date(b.t).getHours());
    const lo = Math.min(10, ...hrs), hi = Math.max(21, ...hrs);
    buckets = Array.from({ length: hi - lo + 1 }, (_, i) => ({ label: String(lo + i), full: `${pad(lo + i)}:00 ถึง ${pad(lo + i)}:59`, v: 0, n: 0, show: true }));
    bills.forEach(b => { const x = buckets[new Date(b.t).getHours() - lo]; x.v += b.total; x.n++; });
  } else {
    buckets = days.map(k => {
      const bs = liveBills(k), dd = parts(k)[2];
      return { label: days.length <= 7 ? fmtDay(k).split(" ")[0] : String(dd), full: fmtDay(k), v: bs.reduce((a, b) => a + b.total, 0), n: bs.length, show: days.length <= 10 || dd === 1 || dd % 5 === 0 };
    });
  }
  const max = Math.max(1, ...buckets.map(b => b.v));
  let sel = S.sel;
  if (sel == null || sel >= buckets.length) { sel = -1; buckets.forEach((b, i) => { if (b.v) sel = i; }); }
  const read = sel >= 0 ? `${buckets[sel].full} <b>${B(buckets[sel].v)}</b> จาก ${buckets[sel].n} บิล` : 'ยังไม่มียอดขายในช่วงนี้';
  const best = buckets.reduce((a, b) => b.v > a.v ? b : a, { v: 0 });

  // ranking
  const agg = {}, tops = {}, drinks = {}, grp = { noodle: 0, top: 0, drink: 0 };
  bills.forEach(b => b.items.forEach(l => {
    if (l.tp) { const m = l.g === 'drink' ? drinks : tops, x = m[l.n] || (m[l.n] = { n: l.n, qty: 0, rev: 0 }); x.qty += l.q; x.rev += l.price * l.q; grp[l.g === 'drink' ? 'drink' : 'top'] += l.price * l.q; return; }
    grp.noodle += l.price * l.q; (l.tops || []).forEach(t => grp.top += t.price * l.q);
    const a = agg[l.p] || (agg[l.p] = { id: l.p, n: l.n, qty: 0, rev: 0, profit: 0 });

  const dset = new Set(days);
  const expSum = allExp().filter(i => i.kind !== 'stock' && dset.has(i.date)).reduce((a, i) => a + i.amt, 0), net = profit - expSum;
  const monthCard = monthlyCard();
  const cash = bills.filter(b => b.pay === 'cash').reduce((a, b) => a + b.total, 0), qr = rev - cash;
  const recent = all.sort((a, b) => b.t < a.t ? -1 : 1).slice(0, 40);
  const billHTML = recent.length ? recent.map(b => `<div class="bill ${b.void ? 'void' : ''}"><div class="tx"><b>${S.range === 'today' ? '' : fmtDay(b.day) + ' '}${new Date(b.t).toTimeString().slice(0, 5)}</b> ${b.pay === 'cash' ? 'เงินสด' : 'พร้อมเพย์'}${b.mn ? ' สมาชิก ' + esc(b.mn) : ''}
      <small>${esc(b.items.map(l => l.n + (l.q > 1 ? ' ×' + l.q : '')).join(', '))}</small></div>
      <div class="am">${B(b.total)}<br>${b.void ? '<span class="tag out">ยกเลิกแล้ว</span>' : `<button class="linkbtn" data-act="editBill" data-id="${b.id}" data-day="${b.day}">แก้ไข</button><button class="linkbtn" data-act="askVoid" data-id="${b.id}" data-day="${b.day}">ยกเลิกบิล</button>`}</div></div>`).join('')
    : '<p class="empty">ยังไม่มีบิลในช่วงนี้ บิลที่ขายจะมาอยู่ตรงนี้</p>';

  return `${hasDemo ? '<p class="note">ตัวเลขตอนนี้มีข้อมูลตัวอย่างปนอยู่ เพื่อให้เห็นหน้าตากราฟ <button data-act="askClearDemo">ลบข้อมูลตัวอย่าง</button></p>' : ''}
  <div class="chips">${ranges.map(([k, t]) => `<button class="chip" data-act="range" data-id="${k}" aria-pressed="${S.range === k}">${t}</button>`).join('')}</div>
  <div class="kpis">
    <div class="kpi main"><span>ยอดขาย</span><b>${B(rev)}</b>${rev ? (net < 0 ? '<i>ขาดทุน</i>' : `<i>กำไรสุทธิ ${Math.round(net / rev * 100)}%</i>`) : ''}</div>
    <div class="kpi"><span>กำไรหลังหักต้นทุนเส้น</span><b>${B(profit)}</b></div>

/* ---------- render: expenses ---------- */
const monthOf = k => k.slice(0, 7);
const expItems = mk => ((S.exp[mk] || {}).items) || [];
const allExp = () => Object.values(S.exp).flatMap(e => e.items || []);
const catOf = id => (S.cfg.buyItems || []).find(c => c.id === id);
const catName = i => i.kind === 'stock' ? 'รับของเข้าสต็อก' : ((catOf(i.cat) || {}).name || 'อื่นๆ');
const sumAmt = a => a.reduce((x, i) => x + (+i.amt || 0), 0);
const signB = v => v < 0 ? '−' + B(-v) : B(v);
const monthLabel = mk => { const [y, m] = mk.split('-').map(Number); return TH_MF[m - 1] + ' ' + (y + 543); };
function monthlyCard() {
  const t = today(), [y, m] = parts(t);
  const months = Array.from({ length: 6 }, (_, i) => dkey(new Date(y, m - 1 - i, 1)).slice(0, 7));
  const rows = months.map(mk => {
    const bs = Object.keys(S.days).filter(k => monthOf(k) === mk).flatMap(liveBills);
    const sales = bs.reduce((a, b) => a + b.total, 0), cost = bs.reduce((a, b) => a + (b.cost || 0), 0);
    const ex = sumAmt(expItems(mk).filter(i => i.kind !== 'stock'));
    return { mk, sales, cost, ex, net: sales - cost - ex };
  }).filter((r, i) => i === 0 || r.sales || r.ex);
  const max = Math.max(1, ...rows.map(r => Math.abs(r.net)));
  return `<section class="card"><h2>กำไรสุทธิรายเดือน</h2><p class="read">ยอดขาย − ต้นทุนเส้น − รายจ่ายร้าน</p>
    ${rows.map(r => `<div class="mrow2"><span>${TH_M[+r.mk.slice(5) - 1]}</span><span class="bar"><i class="${r.net < 0 ? 'neg' : ''}" style="width:${Math.max(r.net ? 3 : 0, Math.abs(r.net) / max * 100)}%"></i></span>
      <span class="v ${r.net < 0 ? 'neg' : ''}">${signB(r.net)}<small>ขาย ${B(r.sales)} จ่าย ${B(r.cost + r.ex)}</small></span></div>`).join('')}</section>`;
}
function cashToday() {
  const t = today();
  const sales = liveBills(t).filter(b => b.pay === 'cash').reduce((a, b) => a + b.total, 0);
  const out = sumAmt(expItems(monthOf(t)).filter(i => i.date === t && i.pay === 'cash'));
  return { sales, out };
}
const expLines = i => i.lines || [{ n: catName(i), qty: 1, price: i.amt, amt: i.amt }];
const linesText = i => i.kind === 'stock' ? `${i.pn} ${i.qty} ${i.pu || 'ซอง'} ${i.pu || 'ซอง'}ละ ${B(i.unit)}` : expLines(i).map(l => l.n + (l.qty > 1 ? ' ×' + l.qty : '')).join(', ');
function viewExp() {
  const t = today(), cur = monthOf(t), [y, m] = parts(t), prev = dkey(new Date(y, m - 2, 1)).slice(0, 7);
  const mk = S.expM === 'prev' ? prev : cur;
  const items = expItems(mk).slice().sort((a, b) => a.date !== b.date ? (a.date < b.date ? 1 : -1) : (a.t < b.t ? 1 : -1));
  const ops = items.filter(i => i.kind !== 'stock'), stock = items.filter(i => i.kind === 'stock');
  const opSum = sumAmt(ops), stSum = sumAmt(stock);
  const agg = {}; ops.forEach(i => expLines(i).forEach(l => { const a = agg[l.n] || (agg[l.n] = { n: l.n, amt: 0, qty: 0 }); a.amt += l.amt; a.qty += l.qty; }));
  const top = Object.values(agg).sort((a, b) => b.amt - a.amt), tmax = Math.max(1, ...top.map(x => x.amt));
  const due = mk === cur ? S.cfg.buyItems.filter(b => b.fixed && !ops.some(i => expLines(i).some(l => l.cid === b.id || l.n === b.name))) : [];
  const close = (S.days[t] || {}).close;
  const dueHTML = due.length ? `<section class="card"><h2>จ่ายประจำที่ยังไม่บันทึกเดือนนี้</h2>${due.map(b => `<div class="due"><div class="tx"><b>${esc(b.name)}</b><small>${b.price ? 'ครั้งก่อน ' + B(b.price) : 'ยังไม่เคยบันทึก'}</small></div><button class="btn sm" data-act="newBuy" data-item="${b.id}">บันทึก</button></div>`).join('')}</section>` : '';
  const closeHTML = mk === cur ? `<section class="card"><h2>ปิดยอดวันนี้</h2>${close
      ? `<div class="cmp"><span>ปิดยอดเมื่อ</span><span>${new Date(close.t).toTimeString().slice(0, 5)}</span><span>เงินที่ควรมีในลิ้นชัก</span><span>${signB(close.expected)}</span><span>นับได้จริง</span><span>${B(close.counted)}</span>
          <span class="tot">${close.diff === 0 ? 'ตรงพอดี' : close.diff > 0 ? 'เงินเกิน' : 'เงินขาด'}</span><span class="tot ${close.diff < 0 ? 'neg' : ''}">${close.diff ? B(Math.abs(close.diff)) : '฿0'}</span></div>
         <button class="btn line" data-act="closeDay">ปิดยอดใหม่</button>`
      : `<p class="read">นับเงินสดในลิ้นชักตอนปิดร้าน เทียบกับที่ระบบคำนวณจากบิลเงินสดและเงินสดที่จ่ายออกวันนี้</p><button class="btn line" data-act="closeDay">ปิดยอดวันนี้</button>`}</section>` : '';
  const list = items.length ? items.map(i => `<div class="bill"><div class="tx"><b>${fmtDay(i.date)}</b> ${i.kind === 'stock' ? 'รับของเข้าสต็อก' : ''}${i.pay === 'transfer' ? ' โอน' : ' เงินสด'}
      <small>${esc(linesText(i))}</small></div>
      <div class="am">${B(i.amt)}<br><button class="linkbtn" data-act="editExp" data-id="${i.id}" data-m="${mk}">แก้ไข</button><button class="linkbtn" data-act="askDelExp" data-id="${i.id}" data-m="${mk}">ลบ</button></div></div>`).join('')
    : '<p class="empty">ยังไม่มีรายการเดือนนี้ กด “ซื้อของ” เพื่อจดรายการแรก</p>';
  return `<div class="chips"><button class="chip" data-act="expM" data-id="cur" aria-pressed="${mk === cur}">เดือนนี้</button><button class="chip" data-act="expM" data-id="prev" aria-pressed="${mk === prev}">เดือนก่อน</button></div>
  <div class="kpis"><div class="kpi main"><span>รายจ่ายร้าน ${monthLabel(mk)}</span><b>${B(opSum)}</b>${stSum ? `<i>รับของเข้าสต็อก ${B(stSum)}</i>` : ''}</div></div>
  <div class="row2" style="margin-bottom:14px"><button class="btn red" data-act="newBuy">ซื้อของ</button><button class="btn" data-act="newStockIn">รับของเข้าสต็อก</button></div>
  <div class="twocol"><div>${dueHTML}${closeHTML}
    <section class="card"><h2>ซื้ออะไรไปบ้าง</h2>${top.length ? `<div class="rank">${top.map(x => `<div class="rk" style="grid-template-columns:1fr auto"><div><div class="nm">${esc(x.n)}</div><div class="bar"><i style="width:${Math.max(3, x.amt / tmax * 100)}%"></i></div></div><div class="v">${B(x.amt)}<small>${x.qty} ชิ้น</small></div></div>`).join('')}</div>` : '<p class="empty">ยังไม่มีรายจ่ายในเดือนนี้</p>'}
    <p class="read" style="margin:12px 0 0">เงินจากปุ่มรับของเข้าสต็อก (เส้นและท็อปปิ้ง) ไม่นับรวมในรายจ่ายร้าน เพราะระบบหักต้นทุนตอนขายไปแล้ว</p></section>
  </div><div><section class="card"><h2>รายการ</h2>${list}</section></div></div>`;
}

/* ---------- render: members ---------- */

  if (!list.length) return `<p class="empty">${S.mem.length ? 'ไม่พบสมาชิกที่ค้นหา ลองพิมพ์เบอร์โทรหรือชื่ออีกแบบ' : 'ยังไม่มีสมาชิก กด “สมัครสมาชิก” เพื่อเพิ่มคนแรก'}</p>`;
  return list.map(m => `<button class="mrow" data-act="${act}" data-id="${m.id}"><span><span class="nm">${esc(m.name)}</span><small>${esc(fmtPhone(m.phone))}${isBday(m) ? ' <span class="tag low">เดือนเกิด</span>' : ''}</small><span class="prog"><i style="width:${Math.min(100, (m.pts || 0) / L.need * 100)}%"></i></span></span><span class="pt">${m.pts || 0}<small>แต้ม</small></span></button>`).join('');

function shrinkImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const Wd = 400, Ht = 320, c = document.createElement('canvas'); c.width = Wd; c.height = Ht;
      const r = Math.max(Wd / im.naturalWidth, Ht / im.naturalHeight), w = im.naturalWidth * r, h = im.naturalHeight * r, g = c.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, Wd, Ht); g.drawImage(im, (Wd - w) / 2, (Ht - h) / 2, w, h);
      URL.revokeObjectURL(url);
      let d = c.toDataURL('image/jpeg', 0.78); if (d.length > 180000) d = c.toDataURL('image/jpeg', 0.6);
      res(d);
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('decode')); };
    im.src = url;
  });
}

/* ---------- PromptPay QR ---------- */
const tlv = (id, v) => id + pad(v.length) + v;
function crc16(s) {
  let c = 0xFFFF;
  for (let i = 0; i < s.length; i++) { c ^= s.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = c & 0x8000 ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF; }
  return c.toString(16).toUpperCase().padStart(4, '0');
}
function ppPayload(target, amount) {
  const t = String(target).replace(/\D/g, '');
  const acc = t.length >= 15 ? tlv('03', t) : t.length >= 13 ? tlv('02', t) : tlv('01', '0066' + t.replace(/^0/, ''));
  const s = tlv('00', '01') + tlv('01', amount ? '12' : '11') + tlv('29', tlv('00', 'A000000677010111') + acc) + tlv('58', 'TH') + tlv('53', '764') + (amount ? tlv('54', amount.toFixed(2)) : '') + '6304';
  return s + crc16(s);
}
function qrSVG(text) {
  try {
    if (typeof qrcode !== 'function') return '';
    const q = qrcode(0, 'M'); q.addData(text); q.make();
    const n = q.getModuleCount(); let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
    return `<svg viewBox="-1 -1 ${n + 2} ${n + 2}" role="img" aria-label="QR พร้อมเพย์" shape-rendering="crispEdges"><path d="${d}" fill="#000"/></svg>`;
  } catch (e) { return ''; }
}

  saveBill: () => {

  if (el.dataset.act === 'scrim' && e.target !== el) return;
  if (S.ro && RO_BLOCK.has(el.dataset.act)) { closeSheet(); render(); toast('บัญชีนี้ดูได้อย่างเดียว บันทึกข้อมูลไม่ได้'); return; }
  const f = ACT[el.dataset.act]; if (f) f(el, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'recv') updateChange();
  else if (t.id === 'sQty' || t.id === 'sAmt' || t.id === 'sProd') updateStockIn();
  else if (t.id === 'cOpen' || t.id === 'cCount') updateClose();
  else if (S.sheet && S.sheet.type === 'buy' && t.closest('#rows')) buyInput(t);
  else if (t.id === 'beDisc') { const s = S.sheet, sub = s.lines.reduce((a, l) => a + unitOf(l) * l.q, 0); s.disc = N(t.value); $('#beTot').textContent = B(Math.max(0, sub - Math.min(s.free || 0, sub) - s.disc)); }
  else if (t.classList.contains('mqi')) t.parentNode.querySelector('.mres').innerHTML = memFind(t.value);
  else if (t.id === 'mq' && S.sheet) { S.sheet.q = t.value; $('#mlist').innerHTML = memListHTML(t.value, 'chooseMem'); }
  else if (t.id === 'sellQ') { S.sellQ = t.value; const g = $('#sellGrid'); if (g) g.innerHTML = sellGridHTML(); }
  else if (t.id === 'mq2') { S.mq = t.value; $('#mlist2').innerHTML = memListHTML(S.mq, 'viewMem'); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'pCat') { $('#pCatNewBox').hidden = t.value !== '__new'; if (t.value === '__new') $('#pCatNew').focus(); return; }
  if (t.id !== 'pImg' || !t.files || !t.files[0] || !S.sheet || (S.sheet.type !== 'prod' && S.sheet.type !== 'topEdit')) return;
  const sh = S.sheet;
  try { const d = await shrinkImage(t.files[0]); if (S.sheet !== sh) return; sh.img = d; $('#pImgBox').innerHTML = photoBlock(sh); }
  catch (err) { toast('เปิดรูปนี้ไม่ได้ ลองเลือกรูปแบบ JPG หรือ PNG'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) closeSheet(); });
window.addEventListener('beforeunload', e => { if (Object.values(W).some(x => x.busy)) { e.preventDefault(); e.returnValue = ''; } });
init();
</script>
</body>
